<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>RootGPT - Visor de Imagen</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    h1 {
      color: #10a37f;
      margin-bottom: 20px;
      font-weight: 300;
      letter-spacing: 2px;
    }

    .contenedor-imagen {
      max-width: 800px;
      width: 100%;
    }

    .imagen-clickeable {
      cursor: zoom-in;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      border-radius: 8px;
      max-width: 100%;
      display: block;
    }

    .imagen-clickeable:hover {
      transform: scale(1.02);
      box-shadow: 0 0 20px rgba(16, 163, 127, 0.5);
    }

    .pista {
      margin-top: 12px;
      color: #888;
      font-size: 14px;
      text-align: center;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0, 0, 0, 0.92);
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-contenido {
      position: relative;
      margin: 3% auto;
      max-width: 90%;
      text-align: center;
    }

    .modal-contenido img {
      max-width: 100%;
      max-height: 75vh;
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(16, 163, 127, 0.4);
    }

    .cerrar {
      position: absolute;
      top: -40px;
      right: 0;
      color: #10a37f;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
      transition: color 0.2s;
    }

    .cerrar:hover { color: #ffffff; }

    .modal-acciones { margin-top: 20px; }

    .btn-descargar {
      background-color: #10a37f;
      color: #000000;
      border: none;
      padding: 12px 28px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.2s;
    }

    .btn-descargar:hover {
      background-color: #0d8a6a;
      transform: translateY(-2px);
    }
  </style>
</head>
