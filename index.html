    <style>
        /* Modo oscuro por defecto */
        :root {
            --cgp-bg: #000000;
            --cgp-surface: #171717;
            --cgp-border: #2f2f2f;
            --cgp-sidebar: #171717;
            --cgp-input: #2f2f2f;
            --cgp-text: #ececec;
            --cgp-text-secondary: #b4b4b4;
        }
        /* Modo claro automático según el sistema */
        @media (prefers-color-scheme: light) {
            :root {
                --cgp-bg: #ffffff;
                --cgp-surface: #f7f7f8;
                --cgp-border: #d9d9e3;
                --cgp-sidebar: #f7f7f8;
                --cgp-input: #f4f4f4;
                --cgp-text: #0d0d0d;
                --cgp-text-secondary: #6e6e80;
            }
        }

        html { height: 100%; }
        body { background-color: var(--cgp-bg); color: var(--cgp-text); font-family: 'Inter', system-ui, sans-serif; height: 100dvh !important; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
        .typing-dot { animation: typingBounce 1.4s infinite ease-in-out both; }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typingBounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        @keyframes pulseRed { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
        .listening { color: #ef4444 !important; animation: pulseRed 1s infinite; }
        .voice-on { box-shadow: 0 0 0 3px rgba(59,130,246,0.5); }
        .think-on { color: var(--cgp-text) !important; background: var(--cgp-input); }
        .safe-top { padding-top: env(safe-area-inset-top); }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
        @media (max-width: 767px) { #footer-text.in-conversation { display: none; } }
        
        .ghost-key { background: rgba(30,30,30,0.4); border: 1px solid rgba(100,100,100,0.2); color: rgba(200,200,200,0.25); transition: all 0.1s; border-radius: 12px; font-size: 1.5rem; font-weight: 400; touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none; }
        .ghost-key:active { background: rgba(50,50,50,0.6); color: rgba(220,220,220,0.5); transform: scale(0.95); }
        .ghost-cancel { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2); color: rgba(239,68,68,0.3); }
        .ghost-cancel:active { background: rgba(239,68,68,0.2); color: rgba(239,68,68,0.5); }
        .ghost-confirm { background: rgba(16,163,127,0.15); border: 1px solid rgba(16,163,127,0.3); color: rgba(16,163,127,0.4); }
        .ghost-confirm:active { background: rgba(16,163,127,0.3); color: rgba(16,163,127,0.6); }
        #send-btn, #home-send { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

        /* Ajustes para modo claro en botones e interacciones */
        @media (prefers-color-scheme: light) {
            .ghost-key { background: rgba(240,240,240,0.8); border-color: rgba(0,0,0,0.1); color: rgba(0,0,0,0.6); }
            .ghost-key:active { background: rgba(220,220,220,0.9); color: rgba(0,0,0,0.8); }
            .ghost-cancel { background: rgba(239,68,68,0.08); color: rgba(239,68,68,0.6); }
            .ghost-confirm { background: rgba(16,163,127,0.1); color: rgba(16,163,127,0.7); }
        }
    </style>

        function getRecognition() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) return null;
            const r = new SR();
            r.lang = 'es-ES'; r.interimResults = false; r.maxAlternatives = 1;
            return r;
        }

        function startDictation(targetId, btn) {
            const r = getRecognition();
            if (!r) { alert('Tu navegador no soporta dictado por voz.'); return; }
            const target = document.getElementById(targetId);
            r.onresult = (e) => {
                const t = e.results[0][0].transcript;
                target.value = (target.value ? target.value + ' ' : '') + t;
                autoResize(target);
                if (target === homeInput) homeChips.classList.toggle('hidden', target.value.trim() !== '');
            };
            r.onend = () => btn.classList.remove('listening');
            r.onerror = () => btn.classList.remove('listening');
            btn.classList.add('listening');
            r.start();
        }

        function toggleVoiceMode() {
            voiceMode = !voiceMode;
            document.querySelectorAll('.voice-btn').forEach(b => b.classList.toggle('voice-on', voiceMode));
            if (voiceMode) listenForConversation();

        }

        function listenForConversation() {
            const r = getRecognition();
            if (!r) { alert('Tu navegador no soporta reconocimiento de voz.'); voiceMode = false; return; }
            activeRecognition = r;
            r.onresult = (e) => { const t = e.results[0][0].transcript; if (t) sendMessage(t); };
            r.onend = () => { activeRecognition = null; };
            r.start();
        }

        function speak(text, onEnd) {
            if (!('speechSynthesis' in window)) { if (onEnd) onEnd(); return; }
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'es-ES';
            u.onend = () => { if (onEnd) onEnd(); };
            u.onerror = () => { if (onEnd) onEnd(); };
            speechSynthesis.speak(u);
        }

        function stopAllVoice() {
            if ('speechSynthesis' in window) speechSynthesis.cancel();
            if (activeRecognition) { try { activeRecognition.stop(); } catch (e) {} activeRecognition = null; }
        }

        window.addEventListener('load', () => {
            const { db, ref, onValue } = window.firebaseDb;
            onValue(ref(db, 'config/lists'), s => { const d = s.val(); allConfigs = d ? Object.entries(d).map(([id, v]) => ({ id, ...v })) : []; });
            onValue(ref(db, 'config/petitions'), s => { const d = s.val(); allPetitions = d ? Object.entries(d).map(([id, v]) => ({ id, ...v })) : []; });
            onValue(ref(db, 'config/images'), s => { const d = s.val(); allImages = d ? Object.entries(d).map(([id, v]) => ({ id, ...v })) : []; });

        });

        function normalizeStr(s) { return (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim(); }

        function cleanMarkdown(text) {
            return String(text)
                .replace(/```[\s\S]*?```/g, '').replace(/`([^`]+)`/g, '$1')
                .replace(/\*\*([^*]+)\*\*/g, '$1').replace(/\*(.+?)\*/g, '$1')
                .replace(/^#{1,6}\s+/gm, '').replace(/^\s*[-•]\s+/gm, '')
                .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '$1').replace(/\s{3,}/g, '\n\n').trim();
        }

        function tryCapitalEffect(text) {
            const m = text.match(/capital\s+de\s+(.+)/i);
            if (!m) return null;
            let q = normalizeStr(m[1]).replace(/[?!.]+$/, '').trim();
            if (q.length < 3) return null;
            let e = geoDict[q];
            if (!e) for (const k of Object.keys(geoDict)) if (k.includes(q) || q.includes(k)) { e = geoDict[k]; break; }
            return e || null;
        }

        function tryPetitionEffect(text) {
            const active = allPetitions.filter(p => p.active !== false);
            const norm = normalizeStr(text);
            const matched = active.find(p => p.trigger && norm.includes(normalizeStr(p.trigger)));
            if (!matched) return null;
            const forced = String(matched.forcedValue);
            const customMsg = (matched.responseMessage || '').trim();
            const combine = (v) => { if (!customMsg) return v; if (customMsg.includes('{vf}')) return customMsg.split('{vf}').join(v); return `${customMsg}\n${v}`; };
            if (matched.type === 'palabra_aleatoria') return combine(forced);
            if (matched.type === 'numero_aleatorio') return combine(forced);
            if (matched.type === 'lista_excepto') {
                const min = matched.options?.min != null ? parseInt(matched.options.min, 10) : 1;
                const max = matched.options?.max != null ? parseInt(matched.options.max, 10) : 10;
                const fn = parseInt(forced, 10);
                const nums = []; for (let i = min; i <= max; i++) if (i !== fn) nums.push(String(i));
                return combine(nums.join('\n'));
            }
            return null;
        }

        const IMAGE_PATTERNS = ['dibuja una imagen de','genera una imagen de','crea una imagen de','hazme un dibujo de','haz un dibujo de','quiero una imagen de','dibuja un','dibuja una','dibuja','pinta un','pinta una','pinta','genera una imagen','crea una imagen','imagen de','un dibujo de'];
        function extractImageRequest(text) {
            const norm = normalizeStr(text);
            let bi = -1, bl = 0;
            for (const p of IMAGE_PATTERNS) { const i = norm.indexOf(p); if (i !== -1 && (bi === -1 || i < bi || (i === bi && p.length > bl))) { bi = i; bl = p.length; } }
            if (bi === -1) return null;
            return text.substring(bi + bl).trim() || text.trim();
        }

        // NUEVO: obtener el prompt activo guardado (si existe)
        function getActivePrompt() {
            return imagePrompts.find(p => p.active && p.prompt) || null;
        }

        // NUEVO: buscar prompt guardado por trigger específico
        function findPromptByTrigger(text) {
            const norm = normalizeStr(text);
            return imagePrompts.find(p => p.trigger && p.prompt && norm.includes(normalizeStr(p.trigger))) || null;
        }

        function tryImageEffect(text) {
            const norm = normalizeStr(text);
            const activeImages = allImages.filter(i => i.active !== false);
            const matched = activeImages.find(i => i.trigger && i.image && norm.includes(normalizeStr(i.trigger)));
            if (matched) return { type: 'predetermined', entry: matched };

            const description = extractImageRequest(text);
            if (description) {
                // NUEVO: si hay un prompt activo guardado, se usa como base en lugar del stylePrompt global
                const activePrompt = getActivePrompt();
                const promptByTrigger = findPromptByTrigger(text);
                let basePrompt = (imageSettings.stylePrompt || '').trim();
                
                if (promptByTrigger) {
                    basePrompt = promptByTrigger.prompt;
                } else if (activePrompt) {
                    basePrompt = activePrompt.prompt;
                }
                
                // Concatenar: base + descripción del espectador
                const full = basePrompt ? `${basePrompt}, ${description}` : description;
                const seed = Math.floor(Math.random() * 1000000);
                return { type: 'generated', url: `https://image.pollinations.ai/prompt/${encodeURIComponent(full)}?width=768&height=768&nologo=true&seed=${seed}` };
            }
            return null;
        }

        function preloadImage(url, timeoutMs) {
            return new Promise((resolve) => {
                const img = new Image();
                const t = setTimeout(() => resolve(false), timeoutMs);
                img.onload = () => { clearTimeout(t); resolve(true); };
                img.onerror = () => { clearTimeout(t); resolve(false); };
                img.src = url;
            });
        }

        function extractWebQuery(text) {
            const m = text.match(/(?:busca en la web|buscame|busca información de|busca informacion de|busca)\s+(.+)/i);
            if (!m) return null;
            return m[1].replace(/[?!.]+$/, '').trim() || null;
        }
        async function searchWeb(query) {
            try {
                const os = await fetch(`https://es.wikipedia.org/w/api.php?action=opensearch&search=${encodeURIComponent(query)}&limit=1&namespace=0&format=json&origin=*`);
                const osData = await os.json();
                const title = osData[1] && osData[1][0];
                if (!title) return null;
                const sum = await fetch(`https://es.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`);
                const sumData = await sum.json();
                return sumData.extract || null;
            } catch (e) { console.error(e); return null; }
        }

        function resetPosition() {
            const { db, ref, set } = window.firebaseDb;
            set(ref(db, 'config/forcePosition'), 1).then(() => { globalPosition = 1; updateFooter(); }).catch(e => console.error(e));
            set(ref(db, 'config/mapEvent'), null).catch(e => console.error(e));
        }

        function updateFooter() {
            const open = !document.getElementById('invisible-panel').classList.contains('hidden');
            const pos = open ? (tempForcePosition || globalPosition) : globalPosition;
            const base = inConversation
                ? 'ChatGPT es IA y puede cometer errores.'
                : 'ChatGPT es IA. Al usarlo, aceptas los <a href="#" class="underline hover:opacity-80">Términos</a> y la <a href="#" class="underline hover:opacity-80">Política de privacidad</a>.';
            footerText.innerHTML = `${base} vs.${pos}`;

        function openInvisiblePanel() {
            if (userInput.value.trim() || homeInput.value.trim()) return;
            document.getElementById('invisible-panel').classList.remove('hidden');
            tempForcePosition = '';

        document.addEventListener('pointerup', function(e) {
            const key = e.target.closest('[data-key]'); if (!key) return;
            const kv = key.getAttribute('data-key');
            if (kv === 'cancel') { document.getElementById('invisible-panel').classList.add('hidden'); tempForcePosition = ''; updateFooter(); }
            else if (kv === 'C') { tempForcePosition = ''; updateFooter(); }
            else if (kv === 'confirm') {
                if (tempForcePosition) {
                    const { db, ref, set } = window.firebaseDb;
                    set(ref(db, 'config/forcePosition'), parseInt(tempForcePosition, 10)).then(() => { document.getElementById('invisible-panel').classList.add('hidden'); tempForcePosition = ''; updateFooter(); }).catch(e => console.error(e));
                } else { document.getElementById('invisible-panel').classList.add('hidden'); updateFooter(); }
            } else { if (tempForcePosition.length < 2) { tempForcePosition += kv; updateFooter(); } }
        });

        async function queryAI(msg) {
            try {
                const res = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: msg }) });
                if (!res.ok) { const e = await res.json().catch(() => ({ error: 'Error' })); throw new Error(e.error || `HTTP ${res.status}`); }
                const d = await res.json();
                return cleanMarkdown(d.reply || 'Sin respuesta del modelo.');
            } catch (e) { console.error(e); return `Lo siento, hubo un problema al conectar con la IA: ${e.message}. Intenta de nuevo.`; }
        }

        async function respond(text, opts) {
            await simulateAIResponse(text, opts);
            if (voiceMode) speak(text, () => { if (voiceMode) listenForConversation(); });
        }

        async function sendMessage(textParam) {
            const text = (textParam !== undefined ? textParam : userInput.value).trim();
            if (!text) return;

            inConversation = true;
            welcomeScreen.classList.add('hidden');
            messagesArea.classList.remove('hidden');
            bottomComposer.classList.remove('hidden');
            mobileBrand.classList.add('hidden');
            footerText.classList.add('in-conversation');
            updateFooter();

            appendMessage('user', text);
            userInput.value = ''; homeInput.value = '';
            autoResize(userInput); autoResize(homeInput);

            const activeLists = allConfigs.filter(c => c.active !== false);
            const normText = normalizeStr(text);
            const matched = activeLists.length ? activeLists.find(c => c.trigger && normText.includes(normalizeStr(c.trigger))) : null;
            if (matched) {
                const nt = normalizeStr(matched.trigger);
                const ti = normText.indexOf(nt);
                let req = text.substring(ti + nt.length).trim() || matched.trigger;
                const list = processForcedList(matched);
                await respond(`Aquí tienes una lista de ${req}:\n\n${list.join('\n')}`);
                return;
            }

            const geo = tryCapitalEffect(text);
            if (geo) {
                const { db, ref, set } = window.firebaseDb;
                set(ref(db, 'config/mapEvent'), { country: geo.country, capital: geo.capital, lat: geo.lat, lng: geo.lng, query: text, updatedAt: Date.now() }).catch(e => console.error(e));
                await respond(`La capital de ${geo.country} es ${geo.capital}.`);
                return;
            }

            const pet = tryPetitionEffect(text);
            if (pet !== null) { await respond(pet); return; }

            const img = tryImageEffect(text);
            if (img) {
                if (img.type === 'predetermined') {
                    const f = parseFloat(img.entry.fakeSeconds);
                    await simulateImageResponse(img.entry.image, img.entry.responseMessage || '', isNaN(f) ? 5 : f);
                } else {
                    await simulateImageResponse(img.url, '', 3);
                }
                if (voiceMode) speak('Aquí tienes tu imagen.', () => { if (voiceMode) listenForConversation(); });
                return;
            }

            const wq = extractWebQuery(text);
            if (wq) {
                const summary = await searchWeb(wq);
                if (summary) { await respond(cleanMarkdown(summary), { thinking: thinkMode }); return; }
            }

            const aiReply = await queryAI(text);
            await respond(aiReply, { thinking: thinkMode });
        }

        function processForcedList(config) {
            const pos = globalPosition || 1;
            let raw = config.list;
            if (raw && typeof raw === 'object' && !Array.isArray(raw)) raw = Object.values(raw);
            let list = (raw || []).map(i => String(i).replace(/^\d+\.\s*/, '').trim()).filter(i => i);
            const fn = config.forcedItem.toLowerCase().trim();
            let oi = list.findIndex(i => i.toLowerCase() === fn);
            if (oi !== -1) list.splice(oi, 1);
            let ap = pos - 1; if (ap < 0) ap = 0; if (ap > list.length) ap = list.length;
            list.splice(ap, 0, config.forcedItem);
            return list.map((i, idx) => `${idx + 1}. ${i}`);
        }

        function appendMessage(role, content) {
            const d = document.createElement('div');
            if (role === 'user') { d.className = 'flex justify-end mb-6'; d.innerHTML = `<div class="bg-cgp-input rounded-2xl px-4 py-3 max-w-[80%] md:max-w-[70%]"><p class="text-cgp-text whitespace-pre-wrap break-words">${escapeHTML(content)}</p></div>`; }
            else { d.className = 'flex justify-start mb-6'; d.innerHTML = `<div class="max-w-[80%] md:max-w-[85%]"><p class="text-cgp-text whitespace-pre-wrap break-words ai-response-text text-base leading-relaxed"></p></div>`; }
            messagesArea.appendChild(d); chatContainer.scrollTop = chatContainer.scrollHeight; return d;
        }

        function addMessageActions(div, text) {
            const row = document.createElement('div');
            row.className = 'flex gap-3 mt-2';
            row.innerHTML = `
                <button data-act="copy" class="text-cgp-text-secondary hover:text-cgp-text transition-colors" title="Copiar">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                </button>
                <button data-act="share" class="text-cgp-text-secondary hover:text-cgp-text transition-colors" title="Compartir">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
                </button>`;
            row.querySelector('[data-act="copy"]').addEventListener('click', () => { if (navigator.clipboard) navigator.clipboard.writeText(text); });
            row.querySelector('[data-act="share"]').addEventListener('click', () => {
                if (navigator.share) navigator.share({ text });
                else if (navigator.clipboard) navigator.clipboard.writeText(text);
            });
            div.querySelector(':scope > div').appendChild(row);
        }

        async function simulateAIResponse(inputText, opts) {
            const thinking = opts && opts.thinking;
            const d = appendMessage('ai', ''); const el = d.querySelector('.ai-response-text');
            el.innerHTML = thinking
                ? `<div class="flex items-center gap-2 pt-2"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-cgp-text-secondary"><path d="M12 2a7 7 0 0 0-7 7c0 2.4 1.2 4.5 3 5.7V17a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-2.3c1.8-1.2 3-3.3 3-5.7a7 7 0 0 0-7-7z"/></svg><span class="text-cgp-text-secondary text-sm">Pensando...</span></div>`
                : `<div class="flex space-x-1 pt-2"><div class="w-2 h-2 bg-cgp-text-secondary rounded-full typing-dot"></div><div class="w-2 h-2 bg-cgp-text-secondary rounded-full typing-dot"></div><div class="w-2 h-2 bg-cgp-text-secondary rounded-full typing-dot"></div></div>`;
            await new Promise(r => setTimeout(r, thinking ? 3000 : 100));
            el.innerHTML = '';
            await typeWriter(el, inputText, 2);
            addMessageActions(d, inputText);
        }

        async function simulateImageResponse(imageUrl, caption, minSeconds) {
            const d = appendMessage('ai', ''); const el = d.querySelector('.ai-response-text');
            el.innerHTML = `<div class="flex items-center gap-3 pt-2"><div class="flex space-x-1"><div class="w-2 h-2 bg-cgp-text-secondary rounded-full typing-dot"></div><div class="w-2 h-2 bg-cgp-text-secondary rounded-full typing-dot"></div><div class="w-2 h-2 bg-cgp-text-secondary rounded-full typing-dot"></div></div><span class="text-cgp-text-secondary text-sm">Pintando tu imagen...</span></div>`;
            chatContainer.scrollTop = chatContainer.scrollHeight;
            const delay = new Promise(r => setTimeout(r, (minSeconds || 0) * 1000));
            const load = preloadImage(imageUrl, 45000);
            const res = await Promise.all([delay, load]);
            if (res[1]) {
                el.innerHTML = `<img src="${imageUrl}" alt="Imagen generada" class="rounded-2xl w-full" style="max-height:420px; object-fit:cover;">` + (caption ? `<p class="text-cgp-text mt-3 whitespace-pre-wrap break-words">${escapeHTML(caption)}</p>` : '');
            } else {
                el.innerHTML = '';
                await typeWriter(el, 'Lo siento, no pude terminar el dibujo en este momento. Intenta de nuevo.', 2);
                return;
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function typeWriter(el, txt, spd) {
            const s = txt.includes('\n') ? 1 : spd;
            for (let i = 0; i < txt.length; i++) { el.innerHTML += txt.charAt(i); chatContainer.scrollTop = chatContainer.scrollHeight; await new Promise(r => setTimeout(r, s)); }
        }

        function escapeHTML(str) { const d = document.createElement('div'); d.appendChild(document.createTextNode(str)); return d.innerHTML; }
    </script>
</body>
</html>
